# Daylight server (Cloudflare Worker). Deploy from this folder with: npx wrangler deploy
name = "daylight-api"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[vars]
# Where the dashboard runs. Only these may receive sign-in sessions or call the API.
ALLOWED_ORIGINS = "https://kratveer.github.io,http://localhost:8000"
# Google accounts allowed to sign in (comma separated). Fill in your Gmail address before deploying.
ALLOWED_EMAILS = "kratveer050@gmail.com"
# Your Google OAuth client ID (the same Web application client the dashboard uses).
GOOGLE_CLIENT_ID = "837914151222-o9al3uib4kv1h8dgfm2e1eig727dd1de.apps.googleusercontent.com"
# Gemini model id (free-tier friendly). Override without redeploying secrets.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Soft cap of analyse calls per signed-in session per hour.
GEMINI_MAX_PER_HOUR = "40"

# Microsoft (extra connection): the Azure app registration's Application (client) ID. Not a secret.
MS_CLIENT_ID = ""
# Microsoft accounts allowed to connect (comma separated). Empty = any Microsoft account, linked only to an allowed Google session.
ALLOWED_MS_EMAILS = ""

# Created with: npx wrangler kv namespace create SESSIONS  — then paste the id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "c175805b8828461ea4292b3f7984e579"

# Secrets (never put these in this file):
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put MS_CLIENT_SECRET   (Azure app registration → Certificates & secrets)
#   npx wrangler secret put TOKEN_KEY        (32 random bytes, base64 — see README)
